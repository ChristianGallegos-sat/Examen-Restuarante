services:
  db-menu:
    image: postgres:16-alpine
    container_name: db-menu
    environment:
      POSTGRES_DB: db_menu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db_menu_data:/var/lib/postgresql/data
    networks:
      - restaurantetech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-orders:
    image: postgres:16-alpine
    container_name: db-orders
    environment:
      POSTGRES_DB: db_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - db_orders_data:/var/lib/postgresql/data
    networks:
      - restaurantetech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-inventory:
    image: postgres:16-alpine
    container_name: db-inventory
    environment:
      POSTGRES_DB: db_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - db_inventory_data:/var/lib/postgresql/data
    networks:
      - restaurantetech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  svc-menu:
    build: ./svc-menu
    container_name: svc-menu
    depends_on:
      db-menu:
        condition: service_healthy
    networks:
      - restaurantetech-network

  svc-orders:
    build: ./svc-orders
    container_name: svc-orders
    depends_on:
      db-orders:
        condition: service_healthy
      svc-menu:
        condition: service_started
      svc-inventory:
        condition: service_started
    networks:
      - restaurantetech-network

  svc-inventory:
    build: ./svc-inventory
    container_name: svc-inventory
    depends_on:
      db-inventory:
        condition: service_healthy
    networks:
      - restaurantetech-network

  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - svc-menu
      - svc-orders
      - svc-inventory
    networks:
      - restaurantetech-network

networks:
  restaurantetech-network:
    driver: bridge

volumes:
  db_menu_data:
  db_orders_data:
  db_inventory_data:
