events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location /api/menu/ {
            set $upstream_menu http://svc-menu:8081;
            proxy_pass $upstream_menu;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/orders {
            set $upstream_orders http://svc-orders:8082;
            proxy_pass $upstream_orders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/inventory {
            set $upstream_inventory http://svc-inventory:8083;
            proxy_pass $upstream_inventory;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
